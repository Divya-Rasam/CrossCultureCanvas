<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Artist Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="mb-4 text-center">Edit Artist Profile</h3>
            <form th:action="@{/artists/update/{id}(id=${artist.id})}" method="post" th:object="${artist}" enctype="multipart/form-data">

              <div class="mb-3">
                <label for="artistName" class="form-label">Artist Name</label>
                <input type="text" class="form-control" id="artistName" th:field="*{artistName}" required>
              </div>

              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" th:field="*{category}" required>
                  <option th:each="cat : ${T(com.crossculture.canvas.model.ArtistCategory).values()}"
                          th:value="${cat}" th:text="${cat}"></option>
                </select>
              </div>

              <div class="mb-3">
                <label for="bio" class="form-label">Bio</label>
                <textarea class="form-control" id="bio" rows="4" th:field="*{bio}" required></textarea>
              </div>

              <div class="mb-3">
                <label for="instagramUrl" class="form-label">Instagram URL</label>
                <input type="url" class="form-control" id="instagramUrl" th:field="*{instagramUrl}">
              </div>

              <div class="mb-3">
                <label for="youtubeUrl" class="form-label">YouTube URL</label>
                <input type="url" class="form-control" id="youtubeUrl" th:field="*{youtubeUrl}">
              </div>

              <div class="mb-3">
                <label for="soundcloudUrl" class="form-label">SoundCloud URL</label>
                <input type="url" class="form-control" id="soundcloudUrl" th:field="*{soundcloudUrl}">
              </div>

              <div class="mb-3">
                <label for="profileImage" class="form-label">Profile Image</label>
                <input type="file" class="form-control" id="profileImage" name="profileImage" accept="image/*">
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
