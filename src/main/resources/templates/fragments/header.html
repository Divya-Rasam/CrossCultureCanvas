    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>

</li>

      <!-- remove -->

        <button class="btn btn-outline-primary btn-sm ms-2" type="submit">Go</button>

 <!-- remove -->


      <ul class="navbar-nav">
        <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/login">Login</a></li>
        <li class="nav-item" sec:authorize="isAnonymous()"><a class="nav-link" href="/register">Register</a></li>
        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown" sec:authentication="name"></a>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/dashboard">Dashboard</a></li>
            <li>
  <a class="dropdown-item" href="/notifications">
    <i class="fas fa-bell me-2"></i> Notifications
    <span class="badge bg-danger ms-auto" id="notifBadge" style="display:none;">0</span>
  </a>
</li>
            <li sec:authorize="hasRole('ARTIST')">
              <a class="dropdown-item" href="/artists/profile">My Profile</a>
              <a class="dropdown-item" href="/media/my-media">My Media</a>
              <a class="dropdown-item" href="/bookings/my-bookings">My Bookings</a>
            </li>
            <li sec:authorize="hasRole('VENUE_OWNER')">
              <a class="dropdown-item" href="/venues/my-venues">My Venues</a>

            </li>

            <li>
              <form th:action="@{/logout}" method="post">

            </li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>




<script>
  // Fetch unread count on page load
  fetch('/notifications/unread-count')
    .then(res => res.json())
    .then(data => {
      const badge = document.getElementById('notifBadge');
      if (data.count > 0) {
        badge.textContent = data.count;
        badge.style.display = 'inline-block';
      }
    })
    .catch(err => console.warn('Notification count failed', err));
</script>

</body>
