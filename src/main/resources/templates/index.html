<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross Culture Canvas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- Navbar Fragment -->
<nav th:replace="~{fragments/header :: navbar}"></nav>

<!-- Hero -->
<section class="hero-section position-relative">
  <div class="hero-backdrop"></div>
<div class="hero-video-container">
  <iframe
    src="https://www.youtube.com/embed/4f5WuKVlsVA?autoplay=1&mute=1&loop=1&playlist=4f5WuKVlsVA&controls=0&showinfo=0&modestbranding=1"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen>
  </iframe>
</div>

  <div class="hero-overlay"></div>
  <div class="container hero-content">
    <h1>Cross Culture Canvas</h1>
    <p>Amplifying underground artists worldwide</p>
    <div sec:authorize="isAnonymous()">
      <a href="/register" class="btn btn-primary btn-lg">Join the Movement</a>
    </div>
    <div sec:authorize="hasRole('ARTIST')">
      <a href="/artists/profile" class="btn btn-primary btn-lg">My Artist Profile</a>
    </div>
    <div sec:authorize="hasRole('VENUE_OWNER')">
      <a href="/venues/my-venues" class="btn btn-primary btn-lg">My Venues</a>
    </div>
  </div>
</section>

<!-- Featured Artists -->
<section class="py-5">
  <div class="container">
    <h2 class="text-center mb-4">Featured Artists</h2>
    <div class="row g-4">
      <div class="col-md-4">
        <div class="card artist-card">
          <img src="/images/rapper.jpg" class="card-img-top" alt="MC Flow">
          <div class="card-body">
            <h5 class="card-title">MC Flow</h5>
            <p class="card-text">Raw lyrics from the streets</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="badge bg-primary">Rapper</span>
              <a href="/artists/1" class="btn btn-outline-primary btn-sm">View</a>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card artist-card">
          <img src="/images/graffiti.jpg" class="card-img-top" alt="Zephyr">
          <div class="card-body">
            <h5 class="card-title">Zephyr</h5>
            <p class="card-text">Transforming walls into art</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="badge bg-primary">Graffiti</span>
              <a href="/artists/2" class="btn btn-outline-primary btn-sm">View</a>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card artist-card">
          <img src="/images/skateboarder.jpg" class="card-img-top" alt="Tony Hawk">
          <div class="card-body">
            <h5 class="card-title">Tony Hawk</h5>
            <p class="card-text">Master of urban terrain</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="badge bg-primary">Skateboarder</span>
              <a href="/artists/3" class="btn btn-outline-primary btn-sm">View</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer Fragment -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
