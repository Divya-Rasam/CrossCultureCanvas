<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Cross Culture Canvas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar}"></nav>

<!-- Header -->
<section class="py-5 bg-white border-bottom">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-8">
        <h1>Dashboard</h1>
        <p class="text-muted mb-0">Welcome back, <span th:text="${user.username}"></span>!</p>
      </div>
      <div class="col-md-4 text-md-end mt-3 mt-md-0">
        <div sec:authorize="hasRole('ARTIST')" th:if="${artist == null}">
          <a href="/artists/new" class="btn btn-primary">Create Artist Profile</a>
        </div>
        <div sec:authorize="hasRole('VENUE_OWNER')" th:if="${venues == null or venues.empty}">
          <a href="/venues/new" class="btn btn-primary">Add Venue</a>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Stats -->
<section class="py-5">
  <div class="container">
    <div th:if="${user == null}" class="alert alert-danger">
  User not loaded. Please refresh.
</div>
    <div class="row g-4">
      <div class="col-md-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body text-center">
            <h5 class="mb-1" th:text="${user?.role?.name() == 'ARTIST' ? (mediaCount ?: 0) : (venueCount ?: 0)}">0</h5>
            <small class="text-muted" th:text="${user.role == T(com.crossculture.canvas.model.User.Role).ARTIST ? 'Media Files' : 'Venues'}">Stats</small>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body text-center">
            <h5 class="mb-1" th:text="${pendingBookings ?: 0}">0</h5>
            <small class="text-muted">Pending Bookings</small>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body text-center">
            <h5 class="mb-1" th:text="${approvedBookings ?: 0}">0</h5>
            <small class="text-muted">Approved Bookings</small>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body text-center">
            <h5 class="mb-1" th:text="${unreadCount ?: 0}">0</h5>
            <small class="text-muted">Unread Notifications</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
