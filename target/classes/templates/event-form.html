<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${event.id == null ? 'Create Event' : 'Edit Event'} + ' - Cross Culture Canvas'">Event Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Cross Culture Canvas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/artists">Artists</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/venues">Venues</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/events">Events</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/login">Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" href="/register">Register</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown">
                        <span sec:authentication="name">User</span>
                    </a>
                    <ul class="dropdown-menu">
                                                <li>
                            <a class="dropdown-item" href="/dashboard">
                                <i class="fas fa-tachometer-alt me-2"></i> Dashboard
                            </a>
                        </li>
<li sec:authorize="hasRole('ARTIST')">
    <a class="dropdown-item" href="/artists/profile">My Profile</a>
    <a class="dropdown-item" href="/media/my-media">My Media</a>
    <a class="dropdown-item" href="/bookings/my-bookings">My Bookings</a>
</li>
<li sec:authorize="hasRole('VENUE_OWNER')">
    <a class="dropdown-item" href="/venues/my-venues">My Venues</a>
    <a class="dropdown-item" href="/bookings/venue-bookings">Venue Bookings</a>
</li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

    <!-- Event Form -->
    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card bg-dark text-white">
                        <div class="card-header">
                            <h3 class="text-center" th:text="${event.id == null ? 'Create New Event' : 'Edit Event'}">Event Form</h3>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/events/save}" method="post" th:object="${event}">
                                <input type="hidden" th:field="*{id}" />
                                
                                <div class="mb-3">
                                    <label for="title" class="form-label">Event Title</label>
                                    <input type="text" class="form-control" id="title" th:field="*{title}" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" th:field="*{description}" rows="4" required></textarea>
                                </div>
                                
                                <div class="mb-3" sec:authorize="hasRole('VENUE_OWNER')">
                                    <label for="venue" class="form-label">Venue</label>
                                    <select class="form-select" id="venue" th:field="*{venue}" required>
                                        <option value="">Select a venue</option>
                                        <option th:each="venue : ${venues}" 
                                                th:value="${venue.id}" 
                                                th:text="${venue.name}"
                                                th:selected="${event.venue != null && event.venue.id == venue.id}">Venue</option>
                                    </select>
                                </div>
                                
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="eventDate" class="form-label">Event Date</label>
                                        <input type="date" class="form-control" id="eventDate" th:field="*{eventDate}" required>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="startTime" class="form-label">Start Time</label>
                                        <input type="time" class="form-control" id="startTime" th:field="*{startTime}" required>
                                    </div>
                                    <div class="col-md-3 mb-3">
                                        <label for="endTime" class="form-label">End Time</label>
                                        <input type="time" class="form-control" id="endTime" th:field="*{endTime}" required>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="ticketInfo" class="form-label">Ticket Information</label>
                                    <textarea class="form-control" id="ticketInfo" th:field="*{ticketInfo}" rows="2" 
                                              placeholder="e.g., $10 at the door, Free entry, etc."></textarea>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="posterImage" class="form-label">Poster Image URL</label>
                                    <input type="url" class="form-control" id="posterImage" th:field="*{posterImage}" 
                                           placeholder="https://example.com/poster.jpg">
                                </div>
                                
                                <div class="mb-3">
                                    <label for="status" class="form-label">Status</label>
                                    <select class="form-select" id="status" th:field="*{status}" required>
                                        <option value="">Select status</option>
                                        <option value="UPCOMING">Upcoming</option>
                                        <option value="ONGOING">Ongoing</option>
                                        <option value="COMPLETED">Completed</option>
                                        <option value="CANCELLED">Cancelled</option>
                                    </select>
                                </div>
                                
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Save Event</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2025 Cross Culture Canvas. All rights reserved.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
