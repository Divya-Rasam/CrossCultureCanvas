<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Media - Cross Culture Canvas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/header :: navbar}"></nav>

<section class="py-5 bg-dark text-white">
  <div class="container">
    <div class="row">
      <div class="col-md-8"><h1>My Media</h1><p class="lead">Showcase your work to the world</p></div>
      <div class="col-md-4 text-end"><a th:href="@{/media/upload}" class="btn btn-primary"><i class="fas fa-plus"></i> Upload Media</a></div>
    </div>
  </div>
</section>

<section class="py-3 bg-secondary">
  <div class="container text-center">
    <button class="btn btn-outline-light m-1 filter-btn active" data-filter="all">All</button>
    <button class="btn btn-outline-light m-1 filter-btn" data-filter="image">Images</button>
    <button class="btn btn-outline-light m-1 filter-btn" data-filter="video">Videos</button>
    <button class="btn btn-outline-light m-1 filter-btn" data-filter="audio">Audio</button>
  </div>
</section>

<section class="py-5">
  <div class="container">
    <div th:if="${#lists.isEmpty(mediaList)}" class="text-center py-5">
      <i class="fas fa-photo-video fa-3x mb-3"></i>
      <h3>You haven't uploaded any media yet</h3>
      <p class="lead">Showcase your work by uploading images, videos, or audio</p>
      <a th:href="@{/media/upload}" class="btn btn-primary">Upload Media</a>
    </div>

    <div th:if="${!#lists.isEmpty(mediaList)}" class="row" id="media-grid">
      <div class="col-md-4 mb-4 media-item" th:each="media : ${mediaList}" th:data-type="${media.type.toString().toLowerCase()}">
        <div class="card media-card">
          <!-- image -->
          <div class="card-img-top media-preview" th:if="${media.type == T(com.crossculture.canvas.model.Media.MediaType).IMAGE}">
            <img th:src="${media.url}" class="img-fluid" alt="Media">
          </div>
          <!-- video thumbnail -->
          <div class="card-img-top media-preview" th:if="${media.type == T(com.crossculture.canvas.model.Media.MediaType).VIDEO}">
            <img th:src="${media.thumbnailUrl != null ? media.thumbnailUrl : 'https://via.placeholder.com/400x300'}" class="img-fluid" alt="Video thumbnail">
            <div class="play-button"><i class="fas fa-play-circle fa-3x"></i></div>
          </div>
          <!-- audio visualiser -->
          <div class="card-img-top media-preview" th:if="${media.type == T(com.crossculture.canvas.model.Media.MediaType).AUDIO}">
            <div class="audio-player">
              <div class="audio-visualizer">
                <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
              </div>
              <div class="audio-info"><i class="fas fa-music fa-2x"></i></div>
            </div>
          </div>

          <div class="card-body">
            <h5 class="card-title" th:text="${media.title}">Media Title</h5>
            <p class="card-text" th:text="${#strings.abbreviate(media.description, 100)}">Description</p>
            <div class="d-flex justify-content-between align-items-center">
              <span class="badge bg-primary" th:text="${media.type}">Type</span>
              <div class="btn-group">
                <a th:href="${media.url}" target="_blank" class="btn btn-sm btn-outline-primary">View</a>
                <a th:href="@{'/media/edit/' + ${media.id}}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <a th:href="@{'/media/delete/' + ${media.id}}" class="btn btn-sm btn-outline-danger"
                   onclick="return confirm('Are you sure you want to delete this media?')">Delete</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/media-filter.js}"></script>
</body>
</html>
