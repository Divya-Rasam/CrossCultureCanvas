<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Checkout - Cross Culture Canvas</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<section class="py-5">
  <div class="container text-center">
    <h2>Pay ₹ <span th:text="${amount}"></span></h2>
    <p class="text-muted">Complete your venue-booking payment</p>
    <button id="payBtn" class="btn btn-primary btn-lg">Pay Now</button>
  </div>
</section>

<script th:inline="javascript">
  const options = {
    key: /*[[${key}]]*/ '',
    amount: /*[[${amount} * 100]]*/ 0, // paise
    currency: "INR",
    name: "Cross Culture Canvas",
    description: "Venue Booking",
    order_id: /*[[${orderId}]]*/ '',
    handler: function (response) {
      const form = document.createElement('form');
      form.method = 'POST';
      form.action = '/payments/success';
      form.innerHTML = `
        <input type="hidden" name="razorpay_payment_id" value="\${response.razorpay_payment_id}">
        <input type="hidden" name="razorpay_order_id"   value="\${response.razorpay_order_id}">
        <input type="hidden" name="razorpay_signature"  value="\${response.razorpay_signature}">
      `;
      document.body.appendChild(form);
      form.submit();
    },
    prefill: {
      name: '',
      email: '',
      contact: ''
    },
    theme: { color: "#6c63ff" }
  };
  const rzp = new Razorpay(options);
  document.getElementById('payBtn').onclick = function () {
    rzp.open();
  };
</script>

</body>
</html>
