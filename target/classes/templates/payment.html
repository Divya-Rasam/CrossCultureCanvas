<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Pay ₹ <span th:text="${amount}"></span></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .payment-box{max-width:480px;margin:80px auto;padding:35px;border:1px solid #dee2e6;border-radius:var(--radius);}
    .gpay-btn{background:#000;color:#fff;width:100%;padding:14px;border:none;border-radius:8px;font-size:16px;}
    #qrcode img{margin:20px auto;}
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-light">
<div class="payment-box card shadow-sm text-center">
  <h4 class="mb-3">Complete Your Payment</h4>
  <p class="text-muted">Amount: <strong>₹ <span th:text="${amount}"></span></strong></p>

  <!-- Google Pay button -->
  <a th:href="${upiLink}" class="btn gpay-btn mb-3">
    <i class="fab fa-google-pay"></i> Pay with Google Pay
  </a>

  <!-- QR code fallback -->
  <p class="small text-muted">Or scan / copy UPI</p>
  <div id="qrcode"></div>
  <input type="text" class="form-control form-control-sm mb-2" th:value="${upiLink}" readonly>

  <!-- manual confirm -->
  <small class="text-muted">Already paid?</small>
  <a th:href="@{/payments/success/{id}(id=${bookingId})}" class="btn btn-sm btn-outline-primary mt-2">Mark Paid</a>
</div>

<script th:inline="javascript">
  new QRCode(document.getElementById("qrcode"), {
    text: /*[[${upiLink}]]*/ '',
    width: 180,
    height: 180
  });
</script>
</body>
</html>
