<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${venue.id == null ? 'Add Venue' : 'Edit Venue'} + ' - Cross Culture Canvas'">Venue Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-white">

<nav th:replace="~{fragments/header :: navbar}"></nav>

<section class="py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card bg-dark text-white border-0 shadow">
          <div class="card-header">
            <h3 class="text-center" th:text="${venue.id == null ? 'Add New Venue' : 'Edit Venue'}">Venue Form</h3>
          </div>
          <div class="card-body p-4">
            <form th:action="@{/venues/save}" method="post" th:object="${venue}">
              <input type="hidden" th:field="*{id}"/>

              <!-- Venue Name -->
              <div class="mb-3">
                <label for="name" class="form-label">Venue Name</label>
                <input type="text" class="form-control" id="name" th:field="*{name}" required>
              </div>

              <!-- Description -->
              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" th:field="*{description}" rows="3" required></textarea>
              </div>

              <!-- Address & City -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="address" class="form-label">Address</label>
                  <input type="text" class="form-control" id="address" th:field="*{address}" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="city" class="form-label">City</label>
                  <input type="text" class="form-control" id="city" th:field="*{city}" required>
                </div>
              </div>

              <!-- State / Zip / Capacity -->
              <div class="row">
                <div class="col-md-4 mb-3">
                  <label for="state" class="form-label">State</label>
                  <input type="text" class="form-control" id="state" th:field="*{state}" required>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="zipCode" class="form-label">Zip Code</label>
                  <input type="text" class="form-control" id="zipCode" th:field="*{zipCode}" required>
                </div>
                <div class="col-md-4 mb-3">
                  <label for="capacity" class="form-label">Capacity</label>
                  <input type="number" class="form-control" id="capacity" th:field="*{capacity}" required>
                </div>
              </div>

              <!-- Hourly Rate & Booking Price (INR) -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="hourlyRate" class="form-label">Hourly Rate (₹)</label>
                  <input type="number" class="form-control" id="hourlyRate" th:field="*{hourlyRate}" step="0.01" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="bookingPrice" class="form-label">Fixed Booking Price (₹)</label>
                  <input type="number" class="form-control" id="bookingPrice" th:field="*{bookingPrice}" step="0.01" required>
                </div>
              </div>

              <!-- Amenities -->
              <div class="mb-3">
                <label for="amenities" class="form-label">Amenities</label>
                <input type="text" class="form-control" id="amenities" th:field="*{amenities}" placeholder="PA System, Lighting, Parking">
              </div>

              <!-- Contact -->
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="contactEmail" class="form-label">Contact Email</label>
                  <input type="email" class="form-control" id="contactEmail" th:field="*{contactEmail}" required>
                </div>
                <div class="col-md-6 mb-3">
                  <label for="contactPhone" class="form-label">Contact Phone</label>
                  <input type="tel" class="form-control" id="contactPhone" th:field="*{contactPhone}" required>
                </div>
              </div>

              <!-- Website -->
              <div class="mb-3">
                <label for="website" class="form-label">Website</label>
                <input type="url" class="form-control" id="website" th:field="*{website}" placeholder="https://example.com">
              </div>

              <!-- Submit -->
              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Save Venue</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
